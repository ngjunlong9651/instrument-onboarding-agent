[project]
name = "onboarding-agent"
version = "0.1.0"
description = "LangGraph multi-agent system for instrument onboarding, price validation and vendor reconciliation, with typed tools, guardrails, human approval and observability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langsmith>=0.1",
    "pydantic>=2.6",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
agent = "onboarding_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
